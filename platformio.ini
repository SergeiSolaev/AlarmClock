; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_protocol = stk500v1 ; Указываем протокол Arduino as ISP
upload_port = COM7
upload_speed = 19200
lib_deps = 
	https://github.com/GyverLibs/microDS3231.git
	https://github.com/GyverLibs/GyverTM1637.git
	https://github.com/PowerBroker2/DFPlayerMini_Fast.git
	https://github.com/adafruit/RTClib
	https://github.com/GyverLibs/EncButton
	https://github.com/GyverLibs/GyverPower
